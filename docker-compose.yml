services:
  kledingkast:
    # Pull the pre-built image from GitHub Container Registry (published by the
    # GitHub Actions workflow). Pin a specific version by replacing ":latest",
    # e.g. ":v1.2.0". Update with `docker compose pull && docker compose up -d`.
    image: ghcr.io/bobvmierlo/wardrobe:latest
    container_name: kledingkast
    restart: unless-stopped
    # Bind to localhost only; put your existing nginx in front as a reverse
    # proxy (see deploy/nginx.conf.example). Change to "8000:8000" to expose
    # directly on the LAN instead.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kledingkast-data:/data
    environment:
      # CHANGE THIS to a long random string (e.g. `openssl rand -hex 32`).
      WARDROBE_SECRET_KEY: "${WARDROBE_SECRET_KEY:?set WARDROBE_SECRET_KEY in .env}"
      # Bootstrap admin, created only on first run when the database is empty.
      WARDROBE_ADMIN_USERNAME: "${WARDROBE_ADMIN_USERNAME:-admin}"
      WARDROBE_ADMIN_PASSWORD: "${WARDROBE_ADMIN_PASSWORD:-changeme}"
      WARDROBE_ADMIN_DISPLAY_NAME: "${WARDROBE_ADMIN_DISPLAY_NAME:-Beheerder}"
      WARDROBE_MAX_UPLOAD_MB: "${WARDROBE_MAX_UPLOAD_MB:-15}"
      # DEBUG, INFO, WARNING of ERROR. Zie `docker compose logs -f kledingkast`
      # en in de app onder Instellingen → Logboek.
      WARDROBE_LOG_LEVEL: "${WARDROBE_LOG_LEVEL:-INFO}"
      # ---- Beveiliging ----
      # De standaarden zijn al de veilige keuze; zie .env.example en de README.
      WARDROBE_LOGIN_MAX_ATTEMPTS: "${WARDROBE_LOGIN_MAX_ATTEMPTS:-5}"
      WARDROBE_LOGIN_LOCKOUT_SECONDS: "${WARDROBE_LOGIN_LOCKOUT_SECONDS:-30}"
      WARDROBE_MIN_PASSWORD_LENGTH: "${WARDROBE_MIN_PASSWORD_LENGTH:-10}"
      WARDROBE_CORS_ORIGINS: "${WARDROBE_CORS_ORIGINS:-}"
      WARDROBE_COOKIE_SECURE: "${WARDROBE_COOKIE_SECURE:-auto}"
      WARDROBE_HSTS_SECONDS: "${WARDROBE_HSTS_SECONDS:-0}"
      WARDROBE_FETCH_ALLOW_PRIVATE: "${WARDROBE_FETCH_ALLOW_PRIVATE:-false}"
      # ---- Inloggen via SSO (OpenID Connect), optioneel ----
      # Alles leeg/false = uit; dan verandert er niets. Zie .env.example en de
      # README. Inloggen met gebruikersnaam en wachtwoord blijft altijd werken,
      # zodat een onbereikbare provider je nooit buitensluit.
      WARDROBE_PUBLIC_URL: "${WARDROBE_PUBLIC_URL:-}"
      WARDROBE_OIDC_ENABLED: "${WARDROBE_OIDC_ENABLED:-false}"
      WARDROBE_OIDC_ISSUER: "${WARDROBE_OIDC_ISSUER:-}"
      WARDROBE_OIDC_CLIENT_ID: "${WARDROBE_OIDC_CLIENT_ID:-}"
      WARDROBE_OIDC_CLIENT_SECRET: "${WARDROBE_OIDC_CLIENT_SECRET:-}"
      WARDROBE_OIDC_SCOPES: "${WARDROBE_OIDC_SCOPES:-openid profile email groups}"
      WARDROBE_OIDC_GROUPS_CLAIM: "${WARDROBE_OIDC_GROUPS_CLAIM:-groups}"
      WARDROBE_OIDC_ADMIN_GROUP: "${WARDROBE_OIDC_ADMIN_GROUP:-}"
      WARDROBE_OIDC_ALLOWED_GROUPS: "${WARDROBE_OIDC_ALLOWED_GROUPS:-}"
      WARDROBE_OIDC_AUTO_CREATE: "${WARDROBE_OIDC_AUTO_CREATE:-false}"
      WARDROBE_OIDC_LINK_BY_USERNAME: "${WARDROBE_OIDC_LINK_BY_USERNAME:-false}"
      WARDROBE_OIDC_BUTTON_LABEL: "${WARDROBE_OIDC_BUTTON_LABEL:-Inloggen met SSO}"
      WARDROBE_OIDC_LOGOUT_REDIRECT: "${WARDROBE_OIDC_LOGOUT_REDIRECT:-false}"
      WARDROBE_LOCAL_LOGIN: "${WARDROBE_LOCAL_LOGIN:-true}"

volumes:
  kledingkast-data:
