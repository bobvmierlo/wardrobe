services:
  kledingkast:
    # Pull the pre-built image from GitHub Container Registry (published by the
    # GitHub Actions workflow). Pin a specific version by replacing ":latest",
    # e.g. ":v1.2.0". Update with `docker compose pull && docker compose up -d`.
    image: ghcr.io/bobvmierlo/wardrobe:latest
    container_name: kledingkast
    restart: unless-stopped
    # Bind to localhost only; put your existing nginx in front as a reverse
    # proxy (see deploy/nginx.conf.example). Change to "8000:8000" to expose
    # directly on the LAN instead.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kledingkast-data:/data
    environment:
      # WARDROBE_SECRET_KEY is the one variable with no sensible default, so it
      # is required here and the stack refuses to start without it.
      - "WARDROBE_SECRET_KEY=${WARDROBE_SECRET_KEY:?set WARDROBE_SECRET_KEY in .env}"
      # Everything else is passed through BY NAME ONLY, which matters for two
      # reasons. Compose hands a bare name to the container only when it is
      # actually set (in .env or your shell), so an unset variable stays unset
      # and app/config.py owns the default — one place, no drift between this
      # file and the code. And because the variable is genuinely absent, the
      # app can tell "you set this" from "this is the built-in default" and says
      # which in the startup log. Writing "${WARDROBE_X:-iets}" instead would
      # always set the variable and throw that distinction away.
      #
      # See .env.example for what each one does; the defaults are listed in the
      # README's configuration table.
      - WARDROBE_PUBLIC_URL
      - WARDROBE_ADMIN_USERNAME
      - WARDROBE_ADMIN_PASSWORD
      - WARDROBE_ADMIN_DISPLAY_NAME
      - WARDROBE_MAX_UPLOAD_MB
      - WARDROBE_LOG_LEVEL
      - WARDROBE_ACCESS_TOKEN_EXPIRE_MINUTES
      # ---- Beveiliging ----
      - WARDROBE_LOGIN_MAX_ATTEMPTS
      - WARDROBE_LOGIN_LOCKOUT_SECONDS
      - WARDROBE_MIN_PASSWORD_LENGTH
      - WARDROBE_CORS_ORIGINS
      - WARDROBE_COOKIE_SECURE
      - WARDROBE_CONTENT_SECURITY_POLICY
      - WARDROBE_HSTS_SECONDS
      - WARDROBE_FETCH_ALLOW_PRIVATE
      # ---- Inloggen via SSO (OpenID Connect), optioneel ----
      - WARDROBE_OIDC_ENABLED
      - WARDROBE_OIDC_ISSUER
      - WARDROBE_OIDC_CLIENT_ID
      - WARDROBE_OIDC_CLIENT_SECRET
      - WARDROBE_OIDC_SCOPES
      - WARDROBE_OIDC_GROUPS_CLAIM
      - WARDROBE_OIDC_ADMIN_GROUP
      - WARDROBE_OIDC_ALLOWED_GROUPS
      - WARDROBE_OIDC_AUTO_CREATE
      - WARDROBE_OIDC_LINK_BY_USERNAME
      - WARDROBE_OIDC_BUTTON_LABEL
      - WARDROBE_OIDC_LOGOUT_REDIRECT
      - WARDROBE_LOCAL_LOGIN

volumes:
  kledingkast-data:
