# Dependabot version updates for this repo's dependency sources.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Related packages are grouped into a single PR per ecosystem. This keeps
# interdependent bumps together (e.g. react + react-dom, or vite +
# @vitejs/plugin-react) so the lockfile still resolves — separate PRs for those
# fail `npm ci` on a peer-dependency conflict.

version: 2
updates:
  # Python backend (FastAPI) — backend/requirements.txt
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]

  # React/Vite frontend — frontend/package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  # Docker base images — Dockerfile in the repo root. Left ungrouped: the two
  # base images (node, python) are independent and their major bumps deserve
  # individual review.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows — .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
