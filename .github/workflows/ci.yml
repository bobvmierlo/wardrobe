name: CI

# Validate every pull request (including Dependabot's) and every push to main,
# so a dependency bump that breaks the build or the backend is caught before merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    # Builds the full multi-stage image (frontend on the node base, runtime on
    # the python base) without pushing, so Dockerfile base-image bumps get
    # validated on the PR instead of only failing at release time.
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t wardrobe:ci .
