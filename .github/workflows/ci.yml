name: CI

# Validate every pull request (including Dependabot's) and every push to main,
# so a dependency bump that breaks the build or the backend is caught before merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 is too old for the test tooling: jsdom's undici dies there
          # with "webidl.util.markAsUncloneable is not a function" before a
          # single test runs. Node 26 — what the Dockerfile builds with — turned
          # out to break it differently, leaving jsdom without a localStorage.
          # So this is pinned to the version the suite is actually verified on.
          #
          # The shipped Node is not left untested by that: the `docker` job runs
          # the real multi-stage build on node:26-alpine, which is where a build
          # incompatibility would show up. This job's value is lint, the unit
          # tests and a fast build signal.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Runs before the build: a hook-dependency mistake is cheaper to see
      # here than after a five-minute Docker build.
      - run: npm run lint
      # The offline queue, the connection probe and the API error mapping: the
      # logic whose bugs are invisible until someone is on a train.
      - run: npm test
      - run: npm run build

  backend:
    # The image ships python:3.14-slim, so 3.14 is the one that has to pass —
    # testing only 3.12 meant the suite had never run on the interpreter our
    # users actually execute. 3.12 stays in the matrix because that is what a
    # contributor is likely to have installed locally.
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    # Builds the full multi-stage image (frontend on the node base, runtime on
    # the python base) without pushing, so Dockerfile base-image bumps get
    # validated on the PR instead of only failing at release time.
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t wardrobe:ci .

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    # Needs both halves: the bundle Vite builds, served by the FastAPI app, which
    # is the shape it actually runs in. A Vite dev server would test a setup
    # nobody deploys.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 is too old for the test tooling: jsdom's undici dies there
          # with "webidl.util.markAsUncloneable is not a function" before a
          # single test runs. Node 26 — what the Dockerfile builds with — turned
          # out to break it differently, leaving jsdom without a localStorage.
          # So this is pinned to the version the suite is actually verified on.
          #
          # The shipped Node is not left untested by that: the `docker` job runs
          # the real multi-stage build on node:26-alpine, which is where a build
          # incompatibility would show up. This job's value is lint, the unit
          # tests and a fast build signal.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the backend
        run: pip install -r backend/requirements.txt
      - name: Install the frontend
        run: npm ci
        working-directory: frontend
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the smoke test
        # playwright.config.ts builds the frontend, puts it where the backend
        # serves it from, and starts the app — see frontend/e2e/serve.sh.
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
