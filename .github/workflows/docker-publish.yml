name: Build and publish container

# Runs when a GitHub Release is published. First it stamps the release version
# into backend/app/_version.py (the single source of truth) and commits it back
# to main with [skip ci], then it builds the Docker image from that exact commit
# and pushes it to the GitHub Container Registry (ghcr.io/<owner>/<repo>).
#
# We trigger on `release` only (not on the tag push) so a release builds exactly
# once. Plain pushes to main do not produce a container.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp version into _version.py
        id: stamp
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=$(python3 scripts/bump_version.py "${{ github.event.release.tag_name }}")
          else
            VERSION=$(python3 scripts/bump_version.py --get)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Commit version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/app/_version.py
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: release v${{ steps.stamp.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the stamped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags:
          #  - <version>     the release version (e.g. "0.1.0")
          #  - <major>.<minor>, <major>   when the version is full semver
          #  - latest        newest published release
          #  - <short-sha>   precise pinning
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
