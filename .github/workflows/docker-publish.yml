name: Build and publish container

# Builds the Docker image and pushes it to the GitHub Container Registry
# (ghcr.io/<owner>/<repo>). Runs ONLY for released versions — a pushed semver
# tag (v1.2.3) or a published GitHub Release — so plain pushes to main no
# longer produce a container. Use workflow_dispatch for a manual one-off.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Produce a lowercase-safe image name and useful tags:
          #  - v1.2.3, 1.2   (from the released semver tag)
          #  - latest        (every release points latest at the newest version)
          #  - <short-sha>   (always, for precise pinning)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Bake the released version into the image so the app can show it.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version || github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
